name: N11 Fiyat and Kupon Takip Botu

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Aynı anda üst üste binip çakışma (merge conflict) yaratmasını engelleyen kilit
concurrency:
  group: n11-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      - name: Fiyat Hafızasını Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Önce uzaktaki güncellemeleri çekip çakışmayı önlüyoruz
          git pull origin main --rebase || echo "Rebase atlandı"
          
          git add fiyatlar.json
          git commit -m "Fiyat hafızası güncellendi" || echo "Değişiklik yok"
          git push origin main
