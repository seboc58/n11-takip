name: N11 Fiyat and Kupon Takip Botu

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# GitHub Actions'ın repoya yazabilmesi (commit/push yapabilmesi) için gerekli izin
permissions:
  contents: write

# Aynı anda üst üste binip çakışma yaratmasını engelleyen kilit
concurrency:
  group: n11-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      - name: Fiyat Hafızasını Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. Önce değişen dosyayı stage alanına alıp commit yapıyoruz
          git add fiyatlar.json
          git commit -m "Fiyat hafızası güncellendi [skip ci]" || echo "Değişiklik yok"
          
          # 2. Commit yaptıktan sonra uzaktaki değişikliklerle güvenli şekilde birleştiriyoruz
          git pull --rebase origin main || git rebase --abort
          
          # 3. Güncellenmiş hafızayı repoya pushluyoruz
          git push origin main
